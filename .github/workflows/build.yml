name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4"]
                symfony: ["~7.4.0", "^8.0"]
                sylius: ["~2.2.0", "~2.3.0"]
                database: ["mysql:8.4", "mariadb:11.4", "postgres:16"]
                node: ["22.x"]

                exclude:
                    # Symfony 8 requires PHP >= 8.4
                    -
                        php: "8.3"
                        symfony: "^8.0"

                    # Sylius 2.2 supports Symfony ^6.4 || ~7.4.0 only
                    -
                        sylius: "~2.2.0"
                        symfony: "^8.0"

                    # PHP 8.4 is only needed for the Symfony 8 combination
                    -
                        php: "8.4"
                        symfony: "~7.4.0"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    build_type: "plugin"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse

            -
                name: Run ECS
                run: vendor/bin/ecs check

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                name: Validate Behat configuration
                run: vendor/bin/behat --dry-run --allow-no-tests

            -
                name: Validate database schema
                run: |
                    vendor/bin/console doctrine:schema:update --force -vvv
                    vendor/bin/console doctrine:schema:validate
